# Local build: run packaging/flatpak/build.sh from repo root.
# Flathub: use git source (see packaging/flatpak/README.md) in the flathub-data PR.
app-id: io.github.garrett_webb.terminalpolyominos
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: terminalpolyominos-gui

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib64/pkgconfig
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'

finish-args:
  # GTK window (VTE is built as a module below; not in the GNOME SDK).
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # No network — offline single-player game.

modules:
  # VTE GTK4 is not in org.gnome.Sdk; bundle libvte for terminalpolyominos-gui.
  - name: fast-float
    buildsystem: cmake-ninja
    config-opts:
      - -DFASTFLOAT_TEST=OFF
    sources:
      - type: archive
        url: https://github.com/fastfloat/fast_float/archive/refs/tags/v8.2.10.tar.gz
        sha256: 76f958dd97b1cf4d8862d1f0986a47d4bdfa8845252bae15ef0f40de3b95961f

  - name: vte
    buildsystem: meson
    config-opts:
      - -Dglade=false
      - -Dgtk3=false
      - -Dgtk4=true
      - -Dvapi=false
      - -Dicu=false
      - -Dgir=false
      - -Ddocs=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/vte/0.80/vte-0.80.5.tar.xz
        sha256: 58a4e00ab5d4a95b4be4dc57b48308deafd72d6839dbbd076648fa353321cc41

  - name: terminalpolyominos
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DTP_BUILD_GUI=ON
    sources:
      - type: dir
        path: ../..
